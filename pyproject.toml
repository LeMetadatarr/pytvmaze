[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytvmaze"
dynamic = ["version"]
description = "TVmaze show catalog bulk harvester grouped on the harvestkit engine."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [
    { name = "JarbasAi", email = "jarbasai@mailfence.com" },
]
keywords = ["tvmaze", "tv", "metadata", "harvestkit", "scraper"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # TODO: switch to "harvestkit>=0.1.0a1" once harvestkit is published to PyPI
    "harvestkit @ git+https://github.com/LeMetadatarr/harvestkit@dev",
    "requests>=2.25",
    "beautifulsoup4>=4.10",
    "pydantic>=2.0",
]

[project.optional-dependencies]
stealth = ["unblock_requests"]
hf = ["datasets", "huggingface_hub", "pyarrow"]
test = ["pytest"]

[project.scripts]
pytvmaze-harvest = "pytvmaze.harvest:main"

[project.urls]
Homepage = "https://github.com/LeMetadatarr/pytvmaze"

[tool.setuptools.packages.find]
include = ["pytvmaze*"]

[tool.setuptools.dynamic]
version = {attr = "pytvmaze.version.__version__"}
